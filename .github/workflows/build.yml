# Compile gate.
#
# Until this existed, nothing detected a broken build. The last known-good build
# transcript predated HEAD by several weeks, and three build-critical files were
# missing from the repository entirely without anyone noticing, because the only
# machine that ever built the project had them sitting untracked on disk.
#
# This workflow is expected to be red at first. That is the point: a failing build
# you can see beats a working build only one machine can reproduce.

name: Build

on:
  push:
    # Every branch, so work is checked before it is merged rather than after. A
    # branch that does not carry this file (main, the website) never runs it.
    branches: [ '**' ]
  pull_request:
    branches: [ ReshadeBranch, main ]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Win32 / MSVC / Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guards the exact regression that made this repo unbuildable: build inputs that
      # existed only on the machine the game was developed on, because a .gitignore rule
      # hid them from git (a '*' placeholder in a stripped-SDK folder, or EA's '[Dd]ebug*'
      # build-output rule matching files such as bx's debug.h). Every path below is
      # compiled or included by the build. A missing one fails here in seconds, by name,
      # instead of as a compiler error several minutes in.
      - name: Verify build inputs are committed
        shell: pwsh
        run: |
          $required = @(
            'GeneralsMD/Code/Libraries/Include/MSS/MSS.h',
            'GeneralsMD/Code/Main/GeneratedVersion.h',
            'GeneralsMD/Code/GameEngine/Include/generatedVersion.h',
            'GeneralsMD/Code/GameEngine/Include/Common/SafeDisc/CdaPfn.h',
            'GeneralsMD/Code/Libraries/Source/bx/include/bx/debug.h',
            'GeneralsMD/Code/Libraries/Source/bx/src/debug.cpp',
            'GeneralsMD/Code/Libraries/Source/bgfx/src/debug_renderdoc.h',
            'GeneralsMD/Code/Libraries/Source/bgfx/src/debug_renderdoc.cpp',
            'GeneralsMD/Code/Libraries/Source/Compression/LZHCompress/CompLibHeader/lzhl.h',
            'GeneralsMD/Code/Libraries/Source/Compression/LZHCompress/CompLibSource/Lzhl.cpp',
            'GeneralsMD/Code/Libraries/Source/Compression/LZHCompress/CompLibSource/Lz.cpp',
            'GeneralsMD/Code/Libraries/Source/Compression/LZHCompress/CompLibSource/Huff.cpp',
            'zlib-extract/zlib-1.3.1/zlib.h',
            'zlib-extract/zlib-1.3.1/deflate.c'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Build inputs are missing from the repository:"
            $missing | ForEach-Object { Write-Host "::error::  $_" }
            Write-Host "These are needed to configure or compile. If one is gitignored,"
            Write-Host "add a negation for it rather than deleting the ignore rule."
            exit 1
          }
          Write-Host "All $($required.Count) build inputs present."

      - name: Report toolchain versions
        shell: pwsh
        run: |
          cmake --version
          Write-Host "---"
          Write-Host "Note: this project builds as Win32 (x86) only, because the engine"
          Write-Host "still contains MSVC x86 inline __asm. The compiler is reported by"
          Write-Host "the Configure step ('Generals-Modern toolchain: ...')."

      # The CMake root is GeneralsMD/Code, not the repository root. -A Win32 is
      # required: CMakeLists.txt stops the configure on anything else.
      #
      # No -G. Pinning "Visual Studio 17 2022" broke every run so far, because the
      # hosted image no longer carries Visual Studio 2022, so CMake takes the newest
      # Visual Studio installed. That may be a newer MSVC than the 19.44 the game
      # is developed with; the configure log records which one, and a -T toolset
      # pin can follow if the two disagree. CMAKE_BUILD_TYPE is not passed: Visual
      # Studio generators ignore it and take the configuration at build time.
      - name: Configure
        run: cmake -S GeneralsMD/Code -B build -A Win32

      # Every target, not just the game: the test executables have to be built for
      # the step after this one to have anything to run.
      - name: Build
        run: cmake --build build --config Release --parallel

      # A gate: any failing test fails the job. The tests use the CHECK harness in
      # GeneralsMD/Code/Tests/test_harness.h, which still checks in Release (the
      # assert()s it replaced compiled out there, so those tests passed vacuously),
      # and every binary exits non-zero when a CHECK fails. HarnessArmedControl fails
      # on purpose and is registered WILL_FAIL, so it shows that a failing CHECK
      # still fails its test. --no-tests=error fails the step if CTest finds no tests.
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Upload GeneralsZH.exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-win32-release
          path: build/Release/GeneralsZH.exe
          if-no-files-found: error
