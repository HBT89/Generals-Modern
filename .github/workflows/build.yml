# Compile gate.
#
# Until this existed, nothing detected a broken build. The last known-good build
# transcript predated HEAD by several weeks, and three build-critical files were
# missing from the repository entirely without anyone noticing, because the only
# machine that ever built the project had them sitting untracked on disk.
#
# This workflow is expected to be red at first. That is the point: a failing build
# you can see beats a working build only one machine can reproduce.

name: Build

on:
  push:
    # Every branch, so work is checked before it is merged rather than after. A
    # branch that does not carry this file (main, the website) never runs it.
    branches: [ '**' ]
  pull_request:
    branches: [ ReshadeBranch, main ]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Win32 / MSVC / Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guards the exact regression that made this repo unbuildable. Each of these
      # is required to configure or compile, and each was previously hidden by a
      # .gitignore containing '*'. Checking them here fails in seconds with a clear
      # message instead of surfacing as a confusing CMake or compiler error.
      - name: Verify build-critical stubs are committed
        shell: pwsh
        run: |
          $required = @(
            'GeneralsMD/Code/Libraries/Source/GameSpy/gamespy_stub.cpp',
            'GeneralsMD/Code/Libraries/Include/MSS/MSS.h',
            'GeneralsMD/Code/Main/GeneratedVersion.h',
            'GeneralsMD/Code/GameEngine/Include/generatedVersion.h'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Build-critical files are missing from the repository:"
            $missing | ForEach-Object { Write-Host "::error::  $_" }
            Write-Host "These are needed to configure or compile. If one is gitignored,"
            Write-Host "add a negation for it rather than deleting the ignore rule."
            exit 1
          }
          Write-Host "All $($required.Count) build-critical stubs present."

      # Third-party sources EA stripped from the release. Each is #included by code
      # that compiles, and none is in the repository yet: they exist only on the
      # machine the game has been developed on. Reported up front, and not fatal
      # until they are committed or fetched, so the compiler errors further down can
      # be told apart from new breakage.
      - name: Report missing third-party inputs
        shell: pwsh
        run: |
          $inputs = [ordered]@{
            'GeneralsMD/Code/Libraries/Source/Compression/ZLib/zlib.h'                  = 'zlib, for Compression/CompressionManager.cpp'
            'GeneralsMD/Code/Libraries/Source/Compression/LZHCompress/CompLibHeader/lzhl.h' = 'LZH-Light, for LZHCompress/NoxCompress.cpp'
            'GeneralsMD/Code/GameEngine/Include/Common/SafeDisc/CdaPfn.h'             = 'SafeDisc header, for Main/WinMain.cpp'
            'GeneralsMD/Code/Libraries/Source/EABrowserDispatch/BrowserDispatch.h'     = 'MIDL output of BrowserDispatch.idl, for WOLBrowser/WebBrowser.h'
            'GeneralsMD/Code/Libraries/Source/GameSpy/Peer/Peer.h'                     = 'GameSpy SDK, for GameSpy.h, PeerThread.h and 3 more'
            'GeneralsMD/Code/Libraries/Source/GameSpy/GP/GP.h'                         = 'GameSpy SDK, for GameSpyGP.h, BuddyThread.h, PeerDefs.h'
            'GeneralsMD/Code/Libraries/Source/GameSpy/ghttp/ghttp.h'                   = 'GameSpy SDK, for MainMenu.cpp, OptionsMenu.cpp, MainMenuUtils.cpp'
            'GeneralsMD/Code/Libraries/Source/GameSpy/gstats/gpersist.h'               = 'GameSpy SDK, for PersistentStorageThread.h'
          }
          $missing = @($inputs.Keys | Where-Object { -not (Test-Path $_) })
          foreach ($path in $missing) { Write-Host "::warning::Missing input: $path ($($inputs[$path]))" }
          Write-Host "$($missing.Count) of $($inputs.Count) third-party inputs missing."

      - name: Report toolchain versions
        shell: pwsh
        run: |
          cmake --version
          Write-Host "---"
          Write-Host "Note: this project builds as Win32 (x86) only, because the engine"
          Write-Host "still contains MSVC x86 inline __asm. The compiler is reported by"
          Write-Host "the Configure step ('Generals-Modern toolchain: ...')."

      # The CMake root is GeneralsMD/Code, not the repository root. -A Win32 is
      # required: CMakeLists.txt stops the configure on anything else.
      #
      # No -G. Pinning "Visual Studio 17 2022" broke every run so far, because the
      # hosted image no longer carries Visual Studio 2022, so CMake takes the newest
      # Visual Studio installed. That may be a newer MSVC than the 19.44 the game
      # is developed with; the configure log records which one, and a -T toolset
      # pin can follow if the two disagree. CMAKE_BUILD_TYPE is not passed: Visual
      # Studio generators ignore it and take the configuration at build time.
      - name: Configure
        run: cmake -S GeneralsMD/Code -B build -A Win32

      # Every target, not just the game: the test executables have to be built for
      # the step after this one to have anything to run.
      - name: Build
        run: cmake --build build --config Release --parallel

      # Five test executables have existed for months and have never been run by
      # anything -- CTest's own log records zero tests. Do not fail the job on them
      # yet: at least one contains an assertion that contradicts the shipped code,
      # and in Release the asserts compile out entirely. Surface the results, fix
      # the tests, then remove continue-on-error so they become a real gate.
      - name: Run tests
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Upload GeneralsZH.exe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-win32-release
          path: build/Release/GeneralsZH.exe
          if-no-files-found: error
